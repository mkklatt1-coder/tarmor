<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Login | TARMOR{% endblock %}</title>
    {% load static %}
    <!-- Link your stylesheet so your login card stays beautifully styled -->
    <link rel="stylesheet" href="{% static 'css/stylesheet.css' %}">
    <style>
        body {
            background-color: #f7e7ce;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }
        .login-header {
            width: 100%;
            padding: 18px 32px;
            box-sizing: border-box;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }
        .login-header .brand-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
        }
        .login-header .logo {
            height: 48px;
            width: auto;
            display: block;
        }
        .login-main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .login-footer {
            width: 100%;
            padding: 14px 24px;
            box-sizing: border-box;
            text-align: center;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body style="background-color: #f7e7ce; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;">
    
    <header class="login-header">
        <div class="brand-left">
            <img class="logo" src="{% static 'Images/alignment.jpg' %}" alt="Alignment by TARMOR">
            <small><i>by TARMOR</i></small>
        </div>
    </header>
    <main class="login-main">
        {% block content %}
        {% endblock %}
    </main>
    <footer class="login-footer">
        Trademark and copyright licences pending
    </footer>
</body>
</html>
