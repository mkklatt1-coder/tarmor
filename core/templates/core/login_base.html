<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Login | TARMOR{% endblock %}</title>
    {% load static %}
    <!-- Link your stylesheet so your login card stays beautifully styled -->
    <link rel="stylesheet" href="{% static 'css/stylesheet.css' %}">
    <style>
        body {
            display: flex;
            flex-direction: column;
        }
        .login-main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body style="background-color: #f7e7ce; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;">
    
    <div class="brand-left">
        <h1>
            <img class="logo" src="{% static 'Images/alignment.jpg' %}" alt="Alignment by TARMOR">
            <small><i>by TARMOR</i></small>
        </h1>
    </div>
    <main class="login-main">
        {% block content %}
        {% endblock %}
    </main>
    <div class="footer">
        Trademark and copyright licences pending
    </div>
</body>
</html>
